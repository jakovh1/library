<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script async src="main.js"></script>
  <link rel="stylesheet" href="style.css">
  <title>Library</title>
</head>
<body>
  <h1>Library</h1>
  <div id="book-shelf"></div>
  <button id="modal-opener">New Book</button>
  <div id="modal">
    <div class="modal-content">
      <button class="close-btn" id="close-button">✖</button>
      <h2>Add a new book</h2>
      <form action="" id="book-addition-form">
        <input type="text" id="title" placeholder="Book title" required><br />
        <input type="text" id="author" placeholder="Author" required><br />
        <input type="number" id="pages" placeholder="Number of pages" value=0 min="10"><br />
        <div>
          Has it been read? <br />
          <label for="yes"><input type="radio" name="read" id="yes" value="true"> Yes</label>
          <label for="no"><input type="radio" name="read" id="no" value="" checked> No</label>
        </div>
        <input type="submit" value="Add a book" id="new-book">
      </form>
    </div>
  </div>
</body>
</html>
